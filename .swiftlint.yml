excluded:
  - fastlane
  - vendor
  - Windscribe/WireGuard
  - Pods
  - build
  - WindscribeTests
  - PacketTunnel
  - SiriIntents
  - WireGuardTunnel
  - HomeWidget
  - Windscribe/Configurations
  - Windscribe/scrtips
  - MockingbirdMocks
  - .claude
disabled_rules:
  - non_optional_string_data_conversion
  - cyclomatic_complexity
  - trailing_whitespace
  - line_length
  - legacy_constructor
  - comma
  - function_parameter_count
  - unused_enumerated
  - inclusive_language
type_body_length:
  - 500 # warning
  - 1500 # error
file_length:
  warning: 800
  error: 1500
identifier_name:
    min_length:
        warning: 1
function_body_length: 600
# Project Neo — enforcement of "Hard rules for new code" inside Features/ paths.
# Scope: Windscribe/Features/** and WindscribeTV/Features/**.
# Legacy code outside these paths is unaffected — see docs/PROJECT_NEO.md and
# docs/neo/DECISIONS.md (ND-004).
custom_rules:
  neo_no_swinject:
    name: "Neo: no Swinject in Features/"
    regex: '^\s*import\s+Swinject\b'
    message: "New Neo code must use constructor injection + @Environment(@Entry), not Swinject. See docs/PROJECT_NEO.md."
    severity: error
    included: '.*(Windscribe|WindscribeTV)/Features/.*\.swift'
  neo_no_snapkit:
    name: "Neo: no SnapKit in Features/"
    regex: '^\s*import\s+SnapKit\b'
    message: "New Neo code is SwiftUI; do not use SnapKit. See docs/PROJECT_NEO.md."
    severity: error
    included: '.*(Windscribe|WindscribeTV)/Features/.*\.swift'
  neo_no_realmswift:
    name: "Neo: no RealmSwift in Features/"
    regex: '^\s*import\s+RealmSwift\b'
    message: "Persistence in Neo flows through protocol-defined stores backed by GRDB, not Realm directly. See docs/PROJECT_NEO.md."
    severity: error
    included: '.*(Windscribe|WindscribeTV)/Features/.*\.swift'
  neo_no_combine:
    name: "Neo: no Combine in Features/"
    regex: '^\s*import\s+Combine\b'
    message: "Use async/await + AsyncStream. Convert at Apple-API boundaries with .values. See docs/PROJECT_NEO.md."
    severity: error
    included: '.*(Windscribe|WindscribeTV)/Features/.*\.swift'
  neo_no_observableobject:
    name: "Neo: no ObservableObject in Features/"
    regex: '\bObservableObject\b'
    message: "Use the @Observable macro instead of ObservableObject. See docs/PROJECT_NEO.md."
    severity: error
    included: '.*(Windscribe|WindscribeTV)/Features/.*\.swift'
  neo_no_published:
    name: "Neo: no @Published in Features/"
    regex: '@Published\b'
    message: "@Published belongs to ObservableObject; use @Observable + plain stored properties. See docs/PROJECT_NEO.md."
    severity: error
    included: '.*(Windscribe|WindscribeTV)/Features/.*\.swift'
  neo_no_stateobject:
    name: "Neo: no @StateObject in Features/"
    regex: '@StateObject\b'
    message: "Use @State with an @Observable type instead of @StateObject. See docs/PROJECT_NEO.md."
    severity: error
    included: '.*(Windscribe|WindscribeTV)/Features/.*\.swift'
  neo_no_observedobject:
    name: "Neo: no @ObservedObject in Features/"
    regex: '@ObservedObject\b'
    message: "Use @Bindable with an @Observable type instead of @ObservedObject. See docs/PROJECT_NEO.md."
    severity: error
    included: '.*(Windscribe|WindscribeTV)/Features/.*\.swift'
  neo_no_static_shared:
    name: "Neo: no static let shared in Features/"
    regex: '\bstatic\s+(let|var)\s+shared\b'
    message: "App-wide services flow through @Environment, not singletons. See docs/PROJECT_NEO.md."
    severity: error
    included: '.*(Windscribe|WindscribeTV)/Features/.*\.swift'
  neo_no_uiviewcontroller_subclass:
    name: "Neo: no UIViewController subclasses in Features/"
    regex: 'class\s+\w+[^{]*?:\s*[^{]*?\bUIViewController\b'
    message: "New Neo screens are SwiftUI views, not UIKit view controllers. See docs/PROJECT_NEO.md."
    severity: error
    included: '.*(Windscribe|WindscribeTV)/Features/.*\.swift'
  neo_no_assembler_resolve:
    name: "Neo: no Assembler.resolve in Features/"
    regex: '\bAssembler\s*\.\s*resolve\b'
    message: "Resolve services at the composition seam (Windscribe/App/Environment+Dependencies.swift), not inside a Feature. Inject via constructor or @Environment. See docs/PROJECT_NEO.md."
    severity: error
    included: '.*(Windscribe|WindscribeTV)/Features/.*\.swift'
