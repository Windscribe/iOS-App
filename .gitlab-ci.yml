include:
  - project: 'shared/strix-ci-template'
    file: 'strix-scan.yml'

variables:
  XCODE_VERSION: "26.6"

default:
  tags:
    - arm64
  before_script:
    - export LANG=en_US.UTF-8
    - export LC_ALL=en_US.UTF-8
    # Per-job Xcode selection via DEVELOPER_DIR; `xcodes select` needs sudo and mutates global state
    - export DEVELOPER_DIR="$(xcodes installed | awk -v v="$XCODE_VERSION" '$1 == v { print $NF }')/Contents/Developer"
    - test -d "$DEVELOPER_DIR" || { echo "Xcode $XCODE_VERSION not installed on this runner"; exit 1; }
    - xcodebuild -version

stages:
  - lint
  - test
  - build
  - prepare
  - deploy
  - notify

# ─── Rules templates ──────────────────────────────────────────────────────────

.on_mr:
  rules:
    - if: '$CI_MERGE_REQUEST_ID'
      when: always
    - when: never

# ─── Lint ──────────────────────────────────────────────────────────────────────

LintCheck:
  stage: lint
  extends: .on_mr
  script:
    - ruby fastlane/tests/app_store_release_notes_test.rb
    - ruby fastlane/tests/testflight_test.rb
    - fastlane lint

# ─── Test ──────────────────────────────────────────────────────────────────────

UnitTest:
  stage: test
  extends: .on_mr
  script:
    - fastlane test

# ─── Build ─────────────────────────────────────────────────────────────────────

Build-iOS:
  stage: build
  extends: .on_mr
  script:
    - fastlane iOSBuild

Build-tvOS:
  stage: build
  extends: .on_mr
  script:
    - fastlane tvBuild

# ─── Prepare (schedule-only change detection) ─────────────────────────────────

# Short-circuits scheduled deploys when no new commits landed on this ref
# since the last successful scheduled deploy. Writes HAS_CHANGES=true|false
# as a dotenv artifact; consumed by Deploy-iOS-Release and notify-codescribe.
precheck-changes:
  stage: prepare
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: on_success
    - when: never
  script:
    - |
      set -e
      api_url="$CI_API_V4_URL/projects/$CI_PROJECT_ID/pipelines"
      query="ref=$CI_COMMIT_REF_NAME&status=success&source=schedule&per_page=5"
      api_resp=$(curl -sf -H "PRIVATE-TOKEN: $GITLAB_API_TOKEN" "$api_url?$query" || echo '[]')
      last_sha=$(echo "$api_resp" | ruby -rjson -e 'puts (JSON.parse(STDIN.read).first || {}).fetch("sha", "")' 2>/dev/null || echo "")
      if [ -n "$last_sha" ] && [ "$last_sha" = "$CI_COMMIT_SHA" ]; then
        echo "No new commits on $CI_COMMIT_REF_NAME since last scheduled deploy ($last_sha) — gating downstream jobs."
        echo "HAS_CHANGES=false" > precheck.env
      else
        if [ -n "$last_sha" ]; then
          echo "New commits detected since $last_sha — proceeding."
        else
          echo "No prior scheduled deploy found for $CI_COMMIT_REF_NAME — proceeding."
        fi
        echo "HAS_CHANGES=true" > precheck.env
      fi
  artifacts:
    reports:
      dotenv: precheck.env

# ─── Deploy (manual) ──────────────────────────────────────────────────────────

.deploy-ios-base:
  stage: deploy
  script:
    - fastlane iOSTestFlight
  allow_failure: true
  rules:
    - if: '$CI_MERGE_REQUEST_ID'
      when: never
    - when: manual

Deploy-iOS-Release:
  extends: .deploy-ios-base
  variables:
    BUILD_SCHEME: "Windscribe-Release"
  needs:
    - job: precheck-changes
      optional: true
      artifacts: true
  script:
    - |
      if [ "$CI_PIPELINE_SOURCE" = "schedule" ] && [ "${HAS_CHANGES:-true}" != "true" ]; then
        echo "Skipping deploy: no new commits since last scheduled run."
        exit 0
      fi
    - fastlane iOSTestFlight
  rules:
    - if: '$CI_MERGE_REQUEST_ID'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: on_success
      allow_failure: false
    - when: manual
      allow_failure: true

Deploy-iOS-Staging:
  extends: .deploy-ios-base
  variables:
    BUILD_SCHEME: "Windscribe-Staging"

.deploy-tvos-base:
  stage: deploy
  script:
    - fastlane tvTestFlight
  allow_failure: true
  rules:
    - if: '$CI_MERGE_REQUEST_ID'
      when: never
    - when: manual

Deploy-tvOS-Release:
  extends: .deploy-tvos-base
  variables:
    BUILD_SCHEME: "WindscribeTV-Release"

Deploy-tvOS-Staging:
  extends: .deploy-tvos-base
  variables:
    BUILD_SCHEME: "WindscribeTV-Staging"

Update-App-Store-Release-Notes:
  stage: deploy
  script:
    - fastlane updateAppStoreReleaseNotes
  rules:
    - if: '$CI_MERGE_REQUEST_ID'
      when: never
    - if: '$APP_VERSION && $RELEASE_NOTES'
      when: manual
      allow_failure: false
    - when: never

# ─── Notify ───────────────────────────────────────────────────────────────────

notify-codescribe:
  stage: notify
  needs:
    - job: Deploy-iOS-Release
    - job: precheck-changes
      optional: true
      artifacts: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: on_success
    - when: never
  script:
    - |
      if [ "${HAS_CHANGES:-true}" != "true" ]; then
        echo "Deploy was short-circuited (no changes); not pinging Codescribe."
        exit 0
      fi
      curl -s -X POST "$SLACK_WEBHOOK_CODESCRIBE" \
        -H "Content-Type: application/json" \
        -d "{\"text\": \"<@U0ACAUUA6QL> deploy-ios-release completed pipeline=${CI_PIPELINE_URL} ref=${CI_COMMIT_REF_NAME}\"}"