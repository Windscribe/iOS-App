variables:
  XCODE_VERSION: "26.3"

default:
  tags:
    - arm64
  before_script:
    - export LANG=en_US.UTF-8
    - export LC_ALL=en_US.UTF-8
    - xcodes select $XCODE_VERSION

stages:
  - lint
  - test
  - build
  - deploy

# ─── Rules templates ──────────────────────────────────────────────────────────

.on_mr:
  rules:
    - if: '$CI_MERGE_REQUEST_ID'
      when: always
    - when: never

# ─── Lint ──────────────────────────────────────────────────────────────────────

LintCheck:
  stage: lint
  extends: .on_mr
  script:
    - fastlane lint

# ─── Test ──────────────────────────────────────────────────────────────────────

UnitTest:
  stage: test
  extends: .on_mr
  script:
    - fastlane test

# ─── Build ─────────────────────────────────────────────────────────────────────

Build-iOS:
  stage: build
  extends: .on_mr
  script:
    - fastlane iOSBuild

Build-tvOS:
  stage: build
  extends: .on_mr
  script:
    - fastlane tvBuild

# ─── Deploy (manual) ──────────────────────────────────────────────────────────

Deploy-iOS-TestFlight:
  stage: deploy
  script:
    - fastlane iOSTestFlight
  allow_failure: true
  rules:
    - if: '$CI_MERGE_REQUEST_ID'
      when: never
    - when: manual
